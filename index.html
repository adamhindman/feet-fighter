<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feet Fighter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
"use strict";

// ---------- Constants ----------
const W = 960, H = 540;
const GROUND = 470;
const L1 = 120;   // thigh
const L2 = 112;   // shin
const L3 = 46;    // ankle -> toe
const HEEL = 12;  // ankle -> heel
const HIP_Y = GROUND - L1 - L2 - 14;
const STEP = 1 / 120;

// Hip movement
const ACC = 4400, MAX_V = 540, MIN_SEP = 110;
// The arena extends half a screen past each edge; the camera follows the fighters
const WORLD_L = -W / 2, WORLD_R = W * 1.5;
const MAX_SEP = W - 160;
// Thigh (hip joint): a1 = 0 hanging straight down, + = knee raised forward
const G1 = 26, D1 = 7, M_UP = 75, M_DOWN = 60;
const A1_MIN = -0.6, A1_MAX = 2.2;
// Knee: a2 = 0 straight, + = bent backward
const G2 = 22, D2 = 6, M_BEND = 85, M_EXT = 190;
const A2_MIN = 0, A2_MAX = 2.6;
// Ankle: a3 = 0 neutral, passive spring
const K3 = 90, D3 = 9;
// Linkage: a fast knee extension flicks the thigh up, and lifting the
// thigh swings the shin forward (and vice versa for bending / lowering)
const C_KNEE_TO_HIP = 3.0, C_HIP_TO_KNEE = 3.5;
const A3_MIN = -0.6, A3_MAX = 0.9;

// Hits
const MIN_HIT_SPEED = 380;
const HIT_COOLDOWN = 0.35;

// ---------- Canvas ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------- Audio ----------
let audio = null;
function initAudio() {
  if (audio) return;
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
function playHit(power, clash) {
  if (!audio) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const g = audio.createGain();
  osc.type = clash ? "square" : "sine";
  osc.frequency.setValueAtTime(clash ? 420 : 160 + power * 4, t);
  osc.frequency.exponentialRampToValueAtTime(clash ? 200 : 45, t + 0.15);
  g.gain.setValueAtTime(clash ? 0.12 : 0.25 + power * 0.01, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.connect(g).connect(audio.destination);
  osc.start(t); osc.stop(t + 0.22);

  const len = Math.floor(audio.sampleRate * 0.08);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audio.createBufferSource();
  const ng = audio.createGain();
  ng.gain.value = clash ? 0.08 : 0.18;
  src.buffer = buf;
  src.connect(ng).connect(audio.destination);
  src.start(t);
}

// ---------- Fighters ----------
function makeFighter(x, dir, look) {
  const f = {
    x, vx: 0, dir,
    a1: 0.15, w1: 0,
    a2: 0.3, w2: 0,
    a3: 0, w3: 0,
    hp: 100, shownHp: 100,
    hitCd: 0, flash: 0,
    input: {},
    look,
  };
  f.pose = pose(f);
  f.prevSamples = footSamples(f.pose);
  return f;
}

function pose(f) {
  const d = f.dir;
  const Hp = { x: f.x, y: HIP_Y };
  const K = { x: Hp.x + d * L1 * Math.sin(f.a1), y: Hp.y + L1 * Math.cos(f.a1) };
  const s = f.a1 - f.a2;
  const A = { x: K.x + d * L2 * Math.sin(s), y: K.y + L2 * Math.cos(s) };
  const fa = s + Math.PI / 2 - f.a3;
  const T = { x: A.x + d * L3 * Math.sin(fa), y: A.y + L3 * Math.cos(fa) };
  const Hl = { x: A.x - d * HEEL * Math.sin(fa), y: A.y - HEEL * Math.cos(fa) };
  return { H: Hp, K, A, T, Hl, s, fa };
}

function footSamples(p) {
  const pts = [];
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    pts.push({ x: p.Hl.x + (p.T.x - p.Hl.x) * t, y: p.Hl.y + (p.T.y - p.Hl.y) * t });
  }
  return pts;
}

function limit(f, a, w, lo, hi) {
  if (f[a] < lo) { f[a] = lo; if (f[w] < 0) f[w] *= -0.2; }
  if (f[a] > hi) { f[a] = hi; if (f[w] > 0) f[w] *= -0.2; }
}

function stepFighter(f, dt) {
  const i = f.input;

  // Hip slides left/right
  let ax = 0;
  if (i.fwd) ax += f.dir * ACC;
  if (i.back) ax -= f.dir * ACC;
  if (ax) f.vx += ax * dt;
  else f.vx *= Math.exp(-14 * dt);
  f.vx = Math.max(-MAX_V, Math.min(MAX_V, f.vx));
  // Knockback can exceed walking speed; let it bleed off
  f.x += f.vx * dt;

  // Joint torques (as angular accelerations)
  const s = f.a1 - f.a2;
  // Gravity pulls each segment toward vertical; each joint's motion drives the other
  const alpha1 = -G1 * Math.sin(f.a1) - D1 * f.w1
    + (i.up ? M_UP : 0) - (i.down ? M_DOWN : 0)
    - C_KNEE_TO_HIP * f.w2;
  const alpha2 = G2 * Math.sin(s) - D2 * f.w2
    + (i.bend ? M_BEND : 0) - (i.ext ? M_EXT : 0)
    - C_HIP_TO_KNEE * f.w1;
  // Foot flops: spring back to neutral, resist changes in shin angle
  const alphaS = alpha1 - alpha2;
  const alpha3 = -K3 * f.a3 - D3 * f.w3 + 0.7 * alphaS;

  f.w1 += alpha1 * dt; f.a1 += f.w1 * dt;
  f.w2 += alpha2 * dt; f.a2 += f.w2 * dt;
  f.w3 += alpha3 * dt; f.a3 += f.w3 * dt;
  limit(f, "a1", "w1", A1_MIN, A1_MAX);
  limit(f, "a2", "w2", A2_MIN, A2_MAX);
  limit(f, "a3", "w3", A3_MIN, A3_MAX);

  f.hitCd = Math.max(0, f.hitCd - dt);
  f.flash = Math.max(0, f.flash - dt);
}

// ---------- Geometry ----------
function distToSeg(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby)));
  const cx = a.x + abx * t, cy = a.y + aby * t;
  return Math.hypot(p.x - cx, p.y - cy);
}

// ---------- Effects ----------
let particles = [];
let popups = [];
let shake = 0;
let hitStop = 0;

function sparks(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.3 + Math.random() * 0.3, max: 0.6, color });
  }
}

// ---------- Hits ----------
function checkHit(att, def, dt) {
  if (att.hitCd > 0) return;
  const samples = footSamples(att.pose);
  const prev = att.prevSamples;
  const pd = def.pose;
  const parts = [
    { a: pd.H, b: pd.K, r: 19, name: "thigh" },
    { a: pd.K, b: pd.A, r: 15, name: "shin" },
  ];
  const defFoot = footSamples(pd);

  for (let k = 0; k < samples.length; k++) {
    const pt = samples[k];
    const vx = (pt.x - prev[k].x) / dt - def.vx;
    const vy = (pt.y - prev[k].y) / dt;
    const speed = Math.hypot(vx, vy);

    // Foot-on-foot clash: no damage, both bounce
    for (const q of defFoot) {
      if (Math.hypot(pt.x - q.x, pt.y - q.y) < 16 && speed > MIN_HIT_SPEED) {
        att.vx -= att.dir * 260; def.vx += att.dir * 260;
        att.w2 = Math.abs(att.w2) * 0.4; def.w2 = Math.abs(def.w2) * 0.4;
        att.hitCd = def.hitCd = 0.25;
        sparks(pt.x, pt.y, 10, "#9cf", 260);
        playHit(0, true);
        return;
      }
    }

    for (const part of parts) {
      if (distToSeg(pt, part.a, part.b) < part.r + 9) {
        if (speed < MIN_HIT_SPEED) continue;
        const dmg = Math.min(16, 2 + (speed - MIN_HIT_SPEED) / 130);
        def.hp = Math.max(0, def.hp - dmg);
        def.vx += att.dir * Math.min(650, speed * 0.35);
        def.w1 -= speed * 0.004;          // knock the knee back
        if (part.name === "shin") def.w2 += speed * 0.004;
        att.w2 = Math.abs(att.w2) * 0.3;  // foot rebounds
        att.vx -= att.dir * 120;
        att.hitCd = HIT_COOLDOWN;
        def.flash = 0.18;
        shake = Math.min(14, 3 + dmg * 0.6);
        hitStop = Math.min(0.09, 0.02 + dmg * 0.003);
        sparks(pt.x, pt.y, 8 + Math.floor(dmg), "#ffd34d", 200 + speed * 0.2);
        popups.push({ x: pt.x, y: pt.y - 10, text: Math.round(dmg), life: 0.8, big: dmg > 12 });
        playHit(dmg, false);
        return;
      }
    }
  }
}

// ---------- AI ----------
const brain = { state: "approach", t: 0, wait: 0.6, kneeTarget: 1.0, range: 220 };

function aiSet(state) {
  brain.state = state;
  brain.t = 0;
  if (state === "approach") brain.wait = 0.15 + Math.random() * 0.9;
  if (state === "chamber") {
    brain.kneeTarget = 0.6 + Math.random() * 0.9;
    brain.range = 232 * Math.sin(brain.kneeTarget) + 5 + Math.random() * 30;
  }
}

function aiThink(f, o, dt) {
  const i = f.input = {};
  const dist = Math.abs(o.x - f.x);
  const threat = dist < 300 && o.a1 > 0.6 && o.a2 > 1.1;
  brain.t += dt;

  switch (brain.state) {
    case "approach": {
      const want = 232 * Math.sin(1.0) + 10;
      if (dist > want + 15) i.fwd = true;
      else if (dist < want - 50) i.back = true;
      i.bend = f.a2 < 0.4;
      if (threat && Math.random() < dt * 4) aiSet("retreat");
      else if (dist < want + 60 && brain.t > brain.wait) aiSet("chamber");
      break;
    }
    case "chamber": {
      i.up = f.a1 < brain.kneeTarget;
      i.down = f.a1 > brain.kneeTarget + 0.25;
      i.bend = true;
      if (dist > brain.range + 30) i.fwd = true;
      else if (dist < brain.range - 40) i.back = true;
      const ready = f.a2 > 1.6 && Math.abs(f.a1 - brain.kneeTarget) < 0.25 && Math.abs(dist - brain.range) < 45;
      if (ready || brain.t > 0.9) aiSet("kick");
      break;
    }
    case "kick": {
      i.ext = true;
      i.up = f.a1 < brain.kneeTarget;
      if (dist > brain.range) i.fwd = true;
      if (f.a2 < 0.08 || brain.t > 0.35) aiSet("recover");
      break;
    }
    case "recover": {
      if (brain.t < 0.25) i.back = Math.random() < 0.8;
      i.down = f.a1 > 0.4;
      if (brain.t > 0.3 + Math.random() * 0.3) aiSet(Math.random() < 0.25 ? "chamber" : "approach");
      break;
    }
    case "retreat": {
      i.back = true;
      i.bend = true;
      i.down = f.a1 > 0.3;
      if (brain.t > 0.3 + Math.random() * 0.2) aiSet(Math.random() < 0.55 ? "chamber" : "approach");
      break;
    }
  }
}

// ---------- Roster ----------
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.round(Math.min(255, v * k));
  return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`;
}

const ROSTER = [
  { name: "Dmitri Valk", quote: "History is a dialectic between my foot and your nuts.",
    skin: "#f3d2b3", shoe: "#2f7bff", trim: "#bcd6ff" },
  { name: "Okonkwo Steel", quote: "Try all you like, you can't beat STEEL!",
    skin: "#5c3a24", shoe: "#e0a020", trim: "#ffe39a" },
  { name: "Sister Mercy Vance", quote: "May God have mercy on your knees. I shall not.",
    skin: "#c68642", shoe: "#c1121f", trim: "#ffb3b8" },
  { name: "Sgt. Graves", quote: "This ain't my war, but I'm going to win it anyway.",
    skin: "#8d5524", shoe: "#2a9d8f", trim: "#a8f0e6" },
  { name: "Renata Cruz", quote: "With this victory, my brother's debt is paid in full.",
    skin: "#e0ac69", shoe: "#8338ec", trim: "#d9c2ff" },
  { name: "Quiet Punisher Tanaka", quote: "...",
    skin: "#eac39c", shoe: "#e8e8e8", trim: "#555555" },
  { name: "Marcus Strong III", quote: "Nothing personal, this is just business!",
    skin: "#3b2219", shoe: "#ff7a00", trim: "#ffd1a3" },
  { name: "Serpentra", quote: "You cannot run from Serpentra's embrace!",
    skin: "#ffe3cf", shoe: "#3fbf5f", trim: "#bff5cb" },
  { name: "Father Solomon Achebe", quote: "I would prefer not to provide a quote at this time.",
    skin: "#6f4a2f", shoe: "#ff3b8b", trim: "#ffc2da" },
];
for (const r of ROSTER) r.skinDark = shade(r.skin, 0.8);

// Character select grid
const GRID_X = 46, GRID_Y = 104, CELL_W = 180, CELL_H = 124, CELL_GAP = 10;
let selIndex = 0;
const portraits = ROSTER.map(r => makeFighter(0, 1, r));

function cellRect(i) {
  const c = i % 3, r = Math.floor(i / 3);
  return { x: GRID_X + c * (CELL_W + CELL_GAP), y: GRID_Y + r * (CELL_H + CELL_GAP), w: CELL_W, h: CELL_H };
}

function confirmSelect() {
  playerLook = ROSTER[selIndex];
  // Every other fighter, in random order, is the ladder to climb
  game.ladder = ROSTER.filter((_, i) => i !== selIndex);
  for (let i = game.ladder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [game.ladder[i], game.ladder[j]] = [game.ladder[j], game.ladder[i]];
  }
  game.stage = 0;
  playHit(4, false);
  newMatch();
}

function newMatch() {
  cpuLook = game.ladder[game.stage];
  game.wins = [0, 0];
  newRound();
}

const WINS_NEEDED = 2;
const matchDecided = () => game.wins[0] >= WINS_NEEDED || game.wins[1] >= WINS_NEEDED;

// Called from the post-round screens
function advance() {
  if (game.state === "over") {
    if (!matchDecided()) newRound();
    else if (game.wins[0] < WINS_NEEDED) newMatch();             // retry the same opponent
    else if (game.stage + 1 < game.ladder.length) { game.stage++; newMatch(); }
    else { game.state = "champion"; game.t = 0; }
  } else if (game.state === "champion") game.state = "select";
}

function selectKey(key) {
  const c = selIndex % 3, r = Math.floor(selIndex / 3);
  if (key === "arrowleft") selIndex = r * 3 + (c + 2) % 3;
  else if (key === "arrowright") selIndex = r * 3 + (c + 1) % 3;
  else if (key === "arrowup") selIndex = ((r + 2) % 3) * 3 + c;
  else if (key === "arrowdown") selIndex = ((r + 1) % 3) * 3 + c;
  else if (key === "enter" || key === " ") confirmSelect();
}

// ---------- Player input ----------
const keys = {};
addEventListener("keydown", e => {
  initAudio();
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (game.state === "select") { if (!e.repeat) selectKey(k); return; }
  if ((game.state === "over" || game.state === "champion") && game.t > 0.8) {
    if (k === "enter" || k === " ") advance();
    else if (k === "c") game.state = "select";
  }
});
addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
addEventListener("blur", () => { for (const k in keys) keys[k] = false; });

function canvasPoint(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function cellAt(p) {
  for (let i = 0; i < ROSTER.length; i++) {
    const c = cellRect(i);
    if (p.x >= c.x && p.x < c.x + c.w && p.y >= c.y && p.y < c.y + c.h) return i;
  }
  return -1;
}
canvas.addEventListener("mousemove", e => {
  if (game.state !== "select") return;
  const i = cellAt(canvasPoint(e));
  if (i >= 0) selIndex = i;
});
canvas.addEventListener("click", e => {
  initAudio();
  if (game.state !== "select") return;
  const i = cellAt(canvasPoint(e));
  if (i >= 0) { selIndex = i; confirmSelect(); }
});

function readPlayer(f) {
  f.input = {
    fwd: keys["arrowright"],
    back: keys["arrowleft"],
    up: keys["arrowup"],
    down: keys["arrowdown"],
    bend: keys["a"],
    ext: keys["d"],
  };
}

// ---------- Game ----------
const game = { state: "select", t: 0, wins: [0, 0], winner: null, ladder: [], stage: 0 };
let player, cpu, playerLook, cpuLook;
let camX = 0;

function newRound() {
  player = makeFighter(310, 1, playerLook);
  cpu = makeFighter(650, -1, cpuLook);
  particles = []; popups = [];
  camX = 0;
  aiSet("approach");
  game.state = "intro";
  game.t = 0;
  game.winner = null;
}

function update(dt) {
  game.t += dt;
  if (game.state === "select" || game.state === "champion") return;
  // Mid-match rounds roll on by themselves
  if (game.state === "over" && !matchDecided() && game.t > 2.8) advance();

  if (game.state === "fight") {
    readPlayer(player);
    aiThink(cpu, player, dt);
  } else {
    player.input = {};
    cpu.input = {};
    if (game.state === "intro" && game.t > 1.6) { game.state = "fight"; game.t = 0; }
  }

  for (const f of [player, cpu]) {
    f.prevSamples = footSamples(f.pose);
    stepFighter(f, dt);
  }

  // Keep hips apart and on screen
  const gap = cpu.x - player.x;
  if (gap < MIN_SEP) {
    const push = (MIN_SEP - gap) / 2;
    player.x -= push; cpu.x += push;
    if (player.vx > 0) player.vx = 0;
    if (cpu.vx < 0) cpu.vx = 0;
  }
  // Both fighters must fit on screen; whoever is backing away gets stopped
  if (gap > MAX_SEP) {
    const pOut = Math.max(0, -player.vx), cOut = Math.max(0, cpu.vx);
    const share = pOut + cOut > 0 ? pOut / (pOut + cOut) : 0.5;
    const excess = gap - MAX_SEP;
    player.x += excess * share; cpu.x -= excess * (1 - share);
    if (player.vx < 0) player.vx = 0;
    if (cpu.vx > 0) cpu.vx = 0;
  }
  for (const f of [player, cpu]) {
    if (f.x < WORLD_L + 70) { f.x = WORLD_L + 70; f.vx = Math.max(0, f.vx); }
    if (f.x > WORLD_R - 70) { f.x = WORLD_R - 70; f.vx = Math.min(0, f.vx); }
    f.pose = pose(f);
  }
  const camTarget = Math.max(WORLD_L, Math.min(WORLD_R - W, (player.x + cpu.x) / 2 - W / 2));
  camX += (camTarget - camX) * Math.min(1, dt * 10);

  if (game.state === "fight") {
    checkHit(player, cpu, dt);
    checkHit(cpu, player, dt);
    if (player.hp <= 0 || cpu.hp <= 0) {
      game.state = "over";
      game.t = 0;
      game.winner = player.hp <= 0 ? cpu : player;
      game.wins[game.winner === player ? 0 : 1]++;
      hitStop = 0.35;
    }
  }

  for (const f of [player, cpu]) f.shownHp += (f.hp - f.shownHp) * Math.min(1, dt * 3);

  for (const p of particles) {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  shake *= Math.exp(-12 * dt);
}

// ---------- Rendering ----------
function limb(a, b, w, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

function lerpPt(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

function drawFighter(f) {
  const p = f.pose, L = f.look;
  const flash = f.flash > 0;
  const skin = flash ? "#fff" : L.skin;
  const dark = flash ? "#ddd" : L.skinDark;

  // Thigh + shin (dark outline pass, then skin)
  limb(p.H, p.K, 42, dark);
  // Shin stops short of the ankle so its rounded end stays inside the shoe
  const shinEnd = lerpPt(p.A, p.K, 0.12);
  limb(p.K, shinEnd, 34, dark);
  limb(p.H, p.K, 36, skin);
  limb(p.K, shinEnd, 28, skin);

  // Kneecap
  ctx.fillStyle = dark;
  const kx = p.K.x + f.dir * 8 * Math.cos(f.a1 - f.a2 / 2);
  const ky = p.K.y - 8 * Math.sin(f.a1 - f.a2 / 2);
  ctx.beginPath(); ctx.arc(kx, ky, 6, 0, Math.PI * 2); ctx.fill();

  // Sock
  limb(lerpPt(p.A, p.K, 0.12), lerpPt(p.A, p.K, 0.3), 30, flash ? "#fff" : "#f2f2f2");
  limb(lerpPt(p.A, p.K, 0.26), lerpPt(p.A, p.K, 0.3), 30, L.shoe);

  // Shoe
  limb(p.Hl, p.T, 24, L.shoe);
  // Sole on the side away from the shin
  const nx = Math.sin(p.fa + Math.PI / 2) * f.dir, ny = Math.cos(p.fa + Math.PI / 2);
  // Ankle collar so the sock disappears into the shoe
  ctx.fillStyle = L.shoe;
  ctx.beginPath(); ctx.arc(p.A.x + nx * 3, p.A.y + ny * 3, 15, 0, Math.PI * 2); ctx.fill();
  const off = 9;
  limb({ x: p.Hl.x - nx * off, y: p.Hl.y - ny * off }, { x: p.T.x - nx * off, y: p.T.y - ny * off }, 6, L.trim);
  // Laces
  ctx.fillStyle = L.trim;
  for (let t = 0.45; t < 0.9; t += 0.15) {
    const q = lerpPt(p.Hl, p.T, t);
    ctx.beginPath(); ctx.arc(q.x + nx * 6, q.y + ny * 6, 2, 0, Math.PI * 2); ctx.fill();
  }

  // Shorts cuff at the hip
  ctx.save();
  ctx.translate(p.H.x, p.H.y);
  ctx.rotate(-f.dir * f.a1);
  ctx.fillStyle = L.shoe;
  ctx.beginPath();
  ctx.roundRect(-30, -60, 60, 82, 8);
  ctx.fill();
  ctx.fillStyle = L.trim;
  ctx.fillRect(-30, 16, 60, 5);
  ctx.restore();
}

function drawHealth(f, x, alignRight) {
  const w = 380, h = 22, y = 30;
  ctx.fillStyle = "#222";
  ctx.fillRect(x, y, w, h);
  const shown = w * f.shownHp / 100, real = w * f.hp / 100;
  ctx.fillStyle = "#c22";
  if (alignRight) ctx.fillRect(x + w - shown, y, shown, h); else ctx.fillRect(x, y, shown, h);
  ctx.fillStyle = f.hp > 30 ? "#ffd400" : "#ff7b00";
  if (alignRight) ctx.fillRect(x + w - real, y, real, h); else ctx.fillRect(x, y, real, h);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);

  ctx.fillStyle = f.look.shoe;
  ctx.font = "bold 16px monospace";
  ctx.textAlign = alignRight ? "right" : "left";
  ctx.fillText(f.look.name, alignRight ? x + w : x, y + h + 22);
}

function bigText(text, size, color, y) {
  ctx.font = `900 ${size}px Impact, "Arial Black", sans-serif`;
  ctx.textAlign = "center";
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000";
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (game.state === "select") { renderSelect(); return; }

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.translate(-Math.round(camX), 0);

  // Floor spans the whole arena, with marks so scrolling reads
  const g = ctx.createLinearGradient(WORLD_L, 0, WORLD_R, 0);
  g.addColorStop(0, "rgba(255,255,255,0.04)");
  g.addColorStop(0.5, "rgba(255,255,255,0.2)");
  g.addColorStop(1, "rgba(255,255,255,0.04)");
  ctx.fillStyle = g;
  ctx.fillRect(WORLD_L, GROUND, WORLD_R - WORLD_L, 2);
  ctx.fillStyle = "rgba(255,255,255,0.1)";
  for (let x = WORLD_L + 60; x < WORLD_R; x += 120) ctx.fillRect(x, GROUND + 10, 2, 6);
  // Corner posts at the arena edges
  ctx.fillStyle = "rgba(255,255,255,0.12)";
  ctx.fillRect(WORLD_L + 14, GROUND - 260, 6, 262);
  ctx.fillRect(WORLD_R - 20, GROUND - 260, 6, 262);

  // Shadows
  for (const f of [player, cpu]) {
    ctx.fillStyle = "rgba(255,255,255,0.05)";
    ctx.beginPath();
    ctx.ellipse(f.pose.A.x + f.dir * 15, GROUND + 4, 45, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  drawFighter(cpu);
  drawFighter(player);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `900 ${p.big ? 30 : 22}px Impact, "Arial Black", sans-serif`;
    ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "#000";
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.big ? "#ff5a3c" : "#fff";
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  drawHealth(player, 40, false);
  drawHealth(cpu, W - 420, true);
  drawRoundPips(game.wins[0], 40 + 380 - 16, -1);
  drawRoundPips(game.wins[1], W - 420 + 16, 1);
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "#888";
  ctx.fillText(`STAGE ${game.stage + 1}/${game.ladder.length}`, W / 2, 46);

  ctx.font = "13px monospace";
  ctx.fillStyle = "#555";
  ctx.fillText("← →  move     ↑ ↓  raise / lower knee     A  draw foot back     D  kick out", W / 2, H - 22);

  const hint = text => {
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = "#aaa";
    ctx.textAlign = "center";
    ctx.fillText(text, W / 2, 372);
  };
  // The match winner gets the last word
  const winQuote = f => {
    ctx.font = "italic 18px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillStyle = f.look.shoe;
    ctx.fillText(`${f.look.name}: “${f.look.quote}”`, W / 2, 330);
  };
  const round = game.wins[0] + game.wins[1] + 1;

  if (game.state === "intro") {
    if (game.t < 1.0) {
      bigText(round === 3 ? "FINAL ROUND" : "ROUND " + round, 64, "#fff", 230);
      ctx.font = "bold 16px monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#aaa";
      ctx.fillText(`${player.look.name}  vs  ${cpu.look.name}`, W / 2, 270);
    } else bigText("FIGHT!", 90, "#ffd400", 240);
  } else if (game.state === "over") {
    if (matchDecided()) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 300, W, 90);
    }
    bigText("K.O.", 110, "#ff3b3b", 220);
    if (!matchDecided()) {
      bigText(game.winner === player ? "YOU TAKE THE ROUND" : "ROUND LOST", 44, "#fff", 285);
    } else if (game.wins[0] >= WINS_NEEDED) {
      bigText(cpu.look.name.toUpperCase() + " IS DEFEATED", 40, "#fff", 285);
      winQuote(player);
      if (game.t > 0.8) hint(game.stage + 1 < game.ladder.length
        ? "ENTER  next opponent      C  choose fighter"
        : "ENTER  continue");
    } else {
      bigText("YOU LOSE", 48, "#fff", 285);
      winQuote(cpu);
      if (game.t > 0.8) hint("ENTER  rematch      C  choose fighter");
    }
  } else if (game.state === "champion") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    bigText("CHAMPION", 100, "#ffd400", 220);
    bigText(player.look.name.toUpperCase(), 40, player.look.shoe, 280);
    ctx.font = "italic 16px Georgia, serif";
    ctx.fillStyle = "#bbb";
    ctx.textAlign = "center";
    ctx.fillText("Every foot has fallen. It changes nothing.", W / 2, 318);
    if (game.t > 0.8) {
      ctx.font = "bold 16px monospace";
      ctx.fillStyle = "#aaa";
      ctx.fillText("ENTER  choose fighter", W / 2, 370);
    }
  }
}

// Round-win markers beside the health bar, filling inward toward the center
function drawRoundPips(won, x, step) {
  for (let i = 0; i < WINS_NEEDED; i++) {
    const cx = x + step * i * 22;
    ctx.beginPath(); ctx.arc(cx, 72, 7, 0, Math.PI * 2);
    ctx.fillStyle = i < won ? "#ffd400" : "#222";
    ctx.fill();
    ctx.strokeStyle = "#888"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// Breaks text into lines no wider than maxW using the current font
function wrapText(text, maxW) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const test = line ? line + " " + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Draws a roster leg with its foot on y = baseY, hip at x = hipX
function drawPortrait(i, hipX, baseY, scale, a1, a2) {
  const f = portraits[i];
  f.a1 = a1; f.a2 = a2; f.a3 = 0;
  f.pose = pose(f);
  ctx.save();
  ctx.translate(hipX, baseY);
  ctx.scale(scale, scale);
  ctx.translate(0, -GROUND);
  drawFighter(f);
  ctx.restore();
}

function renderSelect() {
  const t = game.t;
  bigText("CHOOSE YOUR FIGHTER", 46, "#fff", 72);

  for (let i = 0; i < ROSTER.length; i++) {
    const c = cellRect(i), r = ROSTER[i], on = i === selIndex;
    ctx.fillStyle = on ? "#1c1c1c" : "#0d0d0d";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = on ? r.shoe : "#333";
    ctx.lineWidth = on ? 3 : 1;
    ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);

    const bob = on ? Math.sin(t * 6) : 0;
    drawPortrait(i, c.x + c.w / 2 - 12, c.y + 80, 0.24, 0.25 + 0.2 * bob, 0.5 + 0.3 * bob);

    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = on ? "#fff" : "#999";
    const lines = wrapText(r.name.toUpperCase(), c.w - 14);
    lines.forEach((ln, k) => ctx.fillText(ln, c.x + c.w / 2, c.y + 98 + k * 14 - (lines.length - 1) * 5));
  }

  // Large preview of the highlighted fighter
  const r = ROSTER[selIndex];
  const px = 640, pw = 290;
  drawPortrait(selIndex, px + 110, 392, 0.82,
    0.35 + 0.25 * Math.sin(t * 1.8), 0.7 + 0.45 * Math.sin(t * 1.8 + 1));

  let size = 34;
  do { ctx.font = `900 ${size}px Impact, "Arial Black", sans-serif`; size -= 2; }
  while (ctx.measureText(r.name.toUpperCase()).width > pw && size > 14);
  ctx.textAlign = "center";
  ctx.lineWidth = 6; ctx.strokeStyle = "#000";
  ctx.strokeText(r.name.toUpperCase(), px + pw / 2, 436);
  ctx.fillStyle = r.shoe;
  ctx.fillText(r.name.toUpperCase(), px + pw / 2, 436);

  ctx.font = "italic 15px Georgia, serif";
  ctx.fillStyle = "#bbb";
  wrapText(`“${r.quote}”`, pw).forEach((ln, k) => ctx.fillText(ln, px + pw / 2, 464 + k * 20));

  ctx.font = "13px monospace";
  ctx.fillStyle = "#555";
  ctx.fillText("← → ↑ ↓  choose     ENTER  fight", W / 2, H - 14);
}

// ---------- Loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (hitStop > 0) {
    const used = Math.min(hitStop, dt);
    hitStop -= used;
    dt -= used;
    // Keep visual effects moving a little during hit-stop
    shake *= 0.98;
  }
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
