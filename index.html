<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feet Fighter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; image-rendering: auto; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
"use strict";

// ---------- Constants ----------
const W = 960, H = 540;
const GROUND = 470;
const L1 = 120;   // thigh
const L2 = 112;   // shin
const L3 = 46;    // ankle -> toe
const HEEL = 12;  // ankle -> heel
const HIP_Y = GROUND - L1 - L2 - 14;
const STEP = 1 / 120;

// Hip movement
const ACC = 6400, MAX_V = 700, MIN_SEP = 110;
// Backing off is quicker than advancing
const BACK_BOOST = 1.5;
// The arena extends half a screen past each edge; the camera follows the fighters
const WORLD_L = -W / 2, WORLD_R = W * 1.5;
const MAX_SEP = W - 160;
// Thigh (hip joint): a1 = 0 hanging straight down, + = knee raised forward
const G1 = 26, D1 = 7, M_UP = 75, M_DOWN = 60;
const A1_MIN = -0.6, A1_MAX = 2.2;
// Knee: a2 = 0 straight, + = bent backward
const G2 = 22, D2 = 6, M_BEND = 85, M_EXT = 190;
const A2_MIN = 0, A2_MAX = 2.6;
// Ankle: a3 = 0 neutral, passive spring
const K3 = 90, D3 = 9;
// Linkage: a fast knee extension flicks the thigh up, and lifting the
// thigh swings the shin forward (and vice versa for bending / lowering)
const C_KNEE_TO_HIP = 4.0, C_HIP_TO_KNEE = 3.5;
// Kicking out (D) also drives the hip forward while the knee is still unfolding
const M_KICK_HIP = 80;
// With no joint input, the leg snaps back to its stance
const REST_A1 = 0.15, REST_A2 = 0.3, K_REC = 150, C_REC = 16;
const A3_MIN = -0.6, A3_MAX = 0.9;

// Hits: only the foot's speed relative to its own hip counts, so walking
// into the opponent does nothing and a full swing hurts a lot
const MIN_SWING = 700;
const HIT_COOLDOWN = 0.35;
// A kick that snaps all the way out without connecting leaves the leg
// overextended: slow, heavy and open. Hitting someone mid-kick or
// overextended is a counter-hit and does extra damage.
const OVER_T = 0.8, OVER_WEAK = 0.1, OVER_SLOW = 0.2;
// Kicking plants you: you can't keep charging forward while the leg goes out
const KICK_MAX_V = 160;
// With the foot cocked back you shuffle; the unloaded fighter can outpace you
const COCK_A2 = 1.2, COCK_SLOW = 0.5;
// Knee check: snapping the knee up with the shin hanging blocks kicks to the
// shin for a short window. The kicker eats some of the damage and is left
// jammed. Hold the knee up longer and it stops blocking (lower it and raise
// it again to re-arm), and you move slowly the whole time it's up.
const CHECK_A1 = 0.8, CHECK_A2 = 0.6, CHECK_WINDOW = 0.45, CHECK_SLOW = 0.45, CHECK_RECOIL = 0.4;
const kneeUp = f => f.a1 > CHECK_A1 && f.a2 > CHECK_A2;
const isChecking = f => kneeUp(f) && f.checkT < CHECK_WINDOW && !f.swing && f.over <= 0;
const COUNTER_MULT = 2.0, HIT_STUN = 0.2;
// Power kick: tilt all the way back (↓) with the foot cocked, then swing
// forward and kick out. Big damage, but while tilted back you take extra.
const BACK_A1 = -0.4, POWER_MULT = 1.6, EXPOSED_MULT = 1.5, MAX_DMG = 45;

// ---------- Canvas ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// ---------- Audio ----------
let audio = null;
// Browsers hold audio until the player interacts. Sounds requested before then
// are dropped rather than queued, so they don't all burst out on the first key.
let audioUnlocked = false;
function initAudio(fromGesture = true) {
  if (fromGesture) audioUnlocked = true;
  if (audio) { if (audio.state === "suspended" && fromGesture) audio.resume(); return; }
  try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
}
const soundOn = () => audio && (audio.state === "running" || audioUnlocked);
function playHit(power, clash) {
  if (!soundOn()) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator();
  const g = audio.createGain();
  osc.type = clash ? "square" : "sine";
  osc.frequency.setValueAtTime(clash ? 420 : 160 + power * 4, t);
  osc.frequency.exponentialRampToValueAtTime(clash ? 200 : 45, t + 0.15);
  g.gain.setValueAtTime(clash ? 0.12 : 0.25 + power * 0.01, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  osc.connect(g).connect(audio.destination);
  osc.start(t); osc.stop(t + 0.22);

  const len = Math.floor(audio.sampleRate * 0.08);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audio.createBufferSource();
  const ng = audio.createGain();
  ng.gain.value = clash ? 0.08 : 0.18;
  src.buffer = buf;
  src.connect(ng).connect(audio.destination);
  src.start(t);
}

// ---------- Fighters ----------
function makeFighter(x, dir, look) {
  const f = {
    x, vx: 0, dir,
    a1: 0.15, w1: 0,
    a2: 0.3, w2: 0,
    a3: 0, w3: 0,
    hp: 100, shownHp: 100,
    hitCd: 0, flash: 0,
    swing: false, over: 0, checkT: 0, windup: false,
    input: {},
    look,
  };
  f.pose = pose(f);
  f.prevSamples = footSamples(f.pose);
  f.prevX = x;
  return f;
}

function pose(f) {
  const d = f.dir;
  const Hp = { x: f.x, y: HIP_Y };
  const K = { x: Hp.x + d * L1 * Math.sin(f.a1), y: Hp.y + L1 * Math.cos(f.a1) };
  const s = f.a1 - f.a2;
  const A = { x: K.x + d * L2 * Math.sin(s), y: K.y + L2 * Math.cos(s) };
  const fa = s + Math.PI / 2 - f.a3;
  const T = { x: A.x + d * L3 * Math.sin(fa), y: A.y + L3 * Math.cos(fa) };
  const Hl = { x: A.x - d * HEEL * Math.sin(fa), y: A.y - HEEL * Math.cos(fa) };
  return { H: Hp, K, A, T, Hl, s, fa };
}

function footSamples(p) {
  const pts = [];
  for (let i = 0; i <= 4; i++) {
    const t = i / 4;
    pts.push({ x: p.Hl.x + (p.T.x - p.Hl.x) * t, y: p.Hl.y + (p.T.y - p.Hl.y) * t });
  }
  return pts;
}

function limit(f, a, w, lo, hi) {
  if (f[a] < lo) { f[a] = lo; if (f[w] < 0) f[w] *= -0.2; }
  if (f[a] > hi) { f[a] = hi; if (f[w] > 0) f[w] *= -0.2; }
}

function stepFighter(f, dt) {
  const i = f.input;

  // Hip slides left/right
  const m = f.over > 0 ? OVER_WEAK : 1;
  f.checkT = kneeUp(f) ? f.checkT + dt : 0;
  const vCap = f.over > 0 ? OVER_SLOW : kneeUp(f) ? CHECK_SLOW : f.a2 > COCK_A2 ? COCK_SLOW : 1;
  const mv = m * vCap;
  let ax = 0;
  if (i.fwd) ax += f.dir * ACC * mv;
  if (i.back) ax -= f.dir * ACC * BACK_BOOST * mv;
  if (ax) f.vx += ax * dt;
  else f.vx *= Math.exp(-14 * dt);
  const fwdV = Math.max(-MAX_V * BACK_BOOST * vCap, Math.min(i.ext ? KICK_MAX_V : MAX_V * vCap, f.vx * f.dir));
  f.vx = fwdV * f.dir;
  // Knockback can exceed walking speed; let it bleed off
  f.x += f.vx * dt;

  // Joint torques (as angular accelerations)
  const s = f.a1 - f.a2;
  // Gravity pulls each segment toward vertical; each joint's motion drives the other
  let alpha1 = -G1 * Math.sin(f.a1) - D1 * f.w1
    + m * ((i.up ? M_UP : 0) - (i.down ? M_DOWN : 0)
      + (i.ext && f.a2 > 0.05 ? M_KICK_HIP : 0))
    - C_KNEE_TO_HIP * f.w2;
  let alpha2 = G2 * Math.sin(s) - D2 * f.w2
    + m * ((i.bend ? M_BEND : 0) - (i.ext ? M_EXT : 0))
    - C_HIP_TO_KNEE * f.w1;
  if (!i.up && !i.down && !i.ext) alpha1 += m * (-K_REC * (f.a1 - REST_A1) - C_REC * f.w1);
  if (!i.bend && !i.ext) alpha2 += m * (-K_REC * (f.a2 - REST_A2) - C_REC * f.w2);
  // Foot flops: spring back to neutral, resist changes in shin angle
  const alphaS = alpha1 - alpha2;
  const alpha3 = -K3 * f.a3 - D3 * f.w3 + 0.7 * alphaS;

  f.w1 += alpha1 * dt; f.a1 += f.w1 * dt;
  f.w2 += alpha2 * dt; f.a2 += f.w2 * dt;
  f.w3 += alpha3 * dt; f.a3 += f.w3 * dt;
  limit(f, "a1", "w1", A1_MIN, A1_MAX);
  limit(f, "a2", "w2", A2_MIN, A2_MAX);
  limit(f, "a3", "w3", A3_MIN, A3_MAX);

  f.hitCd = Math.max(0, f.hitCd - dt);
  f.flash = Math.max(0, f.flash - dt);
  f.over = Math.max(0, f.over - dt);
  // Arm the power kick from the tilted-back, cocked stance; letting go of
  // everything without kicking disarms it
  if (f.a1 < BACK_A1 && f.a2 > COCK_A2) f.windup = true;
  else if (!i.ext && !f.swing) f.windup = false;
}

// A fast extension commits to the kick; reaching full extension with the
// kick still live means it whiffed
function trackSwing(f, dt) {
  const t = f.pose.T, pt = f.prevSamples[4];
  const speed = Math.hypot(t.x - pt.x - (f.x - f.prevX), t.y - pt.y) / dt;
  if (speed > MIN_SWING && f.w2 < 0 && f.input.ext && f.hitCd <= 0) f.swing = true;
  else if (f.swing && f.w2 >= 0 && f.a2 > 0.15) f.swing = false;
  if (f.swing && f.a2 < 0.12) {
    f.swing = false;
    f.windup = false;
    f.over = OVER_T;
    f.vx += f.dir * 140;   // the miss drags the hip forward
    popups.push({ x: t.x, y: t.y - 14, text: "MISS", life: 0.6, color: "#aaa" });
  }
}

// ---------- Geometry ----------
function distToSeg(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const t = Math.max(0, Math.min(1, ((p.x - a.x) * abx + (p.y - a.y) * aby) / (abx * abx + aby * aby)));
  const cx = a.x + abx * t, cy = a.y + aby * t;
  return Math.hypot(p.x - cx, p.y - cy);
}

// ---------- Effects ----------
let particles = [];
let popups = [];
let shake = 0;
let hitStop = 0;

function sparks(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = speed * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 80, life: 0.3 + Math.random() * 0.3, max: 0.6, color });
  }
}

// ---------- Hits ----------
function checkHit(att, def, dt) {
  if (att.hitCd > 0) return;
  const samples = footSamples(att.pose);
  const prev = att.prevSamples;
  const pd = def.pose;
  const parts = [
    { a: pd.H, b: pd.K, r: 19, name: "thigh" },
    { a: pd.K, b: pd.A, r: 15, name: "shin" },
  ];
  const defFoot = footSamples(pd);

  const hipDx = att.x - att.prevX;

  for (let k = 0; k < samples.length; k++) {
    const pt = samples[k];
    const vx = (pt.x - prev[k].x - hipDx) / dt;
    const vy = (pt.y - prev[k].y) / dt;
    const speed = Math.hypot(vx, vy);

    // Foot-on-foot clash: no damage, both bounce
    for (const q of defFoot) {
      if (Math.hypot(pt.x - q.x, pt.y - q.y) < 16 && speed > MIN_SWING) {
        att.vx -= att.dir * 260; def.vx += att.dir * 260;
        att.w2 = Math.abs(att.w2) * 0.4; def.w2 = Math.abs(def.w2) * 0.4;
        att.hitCd = def.hitCd = 0.25;
        att.swing = def.swing = false;
        sparks(pt.x, pt.y, 10, "#9cf", 260);
        playHit(0, true);
        return;
      }
    }

    for (const part of parts) {
      if (distToSeg(pt, part.a, part.b) < part.r + 9) {
        if (speed < MIN_SWING) continue;
        if (part.name === "shin" && isChecking(def)) {
          // Checked: the kick slams into a raised shin
          const recoil = Math.min(8, (1 + (speed - MIN_SWING) / 450) * CHECK_RECOIL);
          att.hp = Math.max(0, att.hp - recoil);
          att.vx -= att.dir * 380;
          att.w2 = Math.abs(att.w2) * 0.3;
          att.swing = false;
          att.windup = false;
          att.over = OVER_T;
          att.hitCd = HIT_COOLDOWN;
          att.flash = 0.12;
          def.vx += att.dir * 80;
          def.w1 -= speed * 0.0008;
          def.hitCd = 0;
          shake = 5;
          hitStop = 0.05;
          sparks(pt.x, pt.y, 12, "#fff", 240);
          popups.push({ x: pt.x, y: pt.y - 20, text: "CHECK", life: 0.8, color: "#9dff6a" });
          playHit(recoil, true);
          return;
        }
        const counter = def.over > 0 || def.swing;
        const power = att.windup;
        const exposed = def.a1 < BACK_A1;
        const dmg = Math.min(MAX_DMG, Math.min(18, 1 + (speed - MIN_SWING) / 450)
          * (counter ? COUNTER_MULT : 1) * (power ? POWER_MULT : 1) * (exposed ? EXPOSED_MULT : 1));
        att.windup = false;
        def.hp = Math.max(0, def.hp - dmg);
        def.vx += att.dir * Math.min(650, speed * 0.15);
        def.w1 -= speed * 0.002;          // knock the knee back
        if (part.name === "shin") def.w2 += speed * 0.002;
        att.w2 = Math.abs(att.w2) * 0.3;  // foot rebounds
        att.vx -= att.dir * 120;
        att.hitCd = HIT_COOLDOWN;
        att.swing = false; att.over = 0;
        def.swing = false; def.over = 0;
        def.hitCd = Math.max(def.hitCd, HIT_STUN);   // no trading back instantly
        def.flash = 0.18;
        shake = Math.min(power ? 22 : 14, 3 + dmg * 0.6);
        hitStop = Math.min(0.09, 0.02 + dmg * 0.003) + (counter ? 0.05 : 0) + (power ? 0.05 : 0);
        sparks(pt.x, pt.y, 8 + Math.floor(dmg), "#ffd34d", 200 + speed * 0.08);
        popups.push({ x: pt.x, y: pt.y - 10, text: Math.round(dmg), life: 0.8, big: dmg >= 12 });
        const tags = [counter && ["COUNTER", "#5ad1ff"], power && ["POWER", "#ff9a2e"], exposed && ["EXPOSED", "#ff5a8a"]].filter(Boolean);
        tags.forEach(([text, color], k) => popups.push({ x: pt.x, y: pt.y - 40 - k * 20, text, life: 0.9, color }));
        if (dmg >= 12) cheerT = clock;
        playHit(dmg, false);
        return;
      }
    }
  }
}

// ---------- AI ----------
const brain = { state: "approach", t: 0, wait: 0.6, kneeTarget: 1.0, range: 220, flick: false, feint: false, wary: false, power: false };

// Later opponents react faster, feint more and punish more reliably
function aiSkill() {
  return 0.3 + 0.7 * game.stage / Math.max(1, game.ladder.length - 1);
}

function aiSet(state) {
  brain.state = state;
  brain.t = 0;
  if (state === "approach") brain.wait = 0.15 + Math.random() * 0.9;
  if (state === "feint") brain.wait = 0.25 + Math.random() * 0.3;
  if (state === "chamber") {
    // Mostly the low draw-back-and-swing; sometimes a raised-knee kick
    brain.flick = Math.random() < 0.65;
    const skill = aiSkill();
    brain.feint = Math.random() < 0.15 + 0.3 * skill;
    brain.wary = Math.random() < 0.2 + 0.7 * skill;   // notices a raised knee in time
    // Sloppier fighters misjudge range and whiff more
    const slop = Math.random() * (1.6 - skill);
    // Now and then, gamble on the big tilted-back power kick
    brain.power = Math.random() < 0.08 + 0.17 * skill;
    if (brain.power) {
      brain.flick = false;
      brain.feint = false;
      brain.range = 205 + 40 * slop;
    } else if (brain.flick) {
      brain.kneeTarget = 0.1 + Math.random() * 0.3;
      brain.range = 195 + 50 * slop;
    } else {
      brain.kneeTarget = 0.6 + Math.random() * 0.9;
      brain.range = 232 * Math.sin(brain.kneeTarget) - 10 + 35 * slop;
    }
  }
  if (state === "punish") {
    brain.power = false;
    brain.flick = true;
    brain.feint = false;
    brain.kneeTarget = 0.2;
  }
}

function aiThink(f, o, dt) {
  const i = f.input = {};
  const dist = Math.abs(o.x - f.x);
  const skill = aiSkill();
  const threat = dist < 300 && (o.a2 > 1.1 || o.swing);
  const busy = brain.state === "kick" || brain.state === "punish";
  const room = f.dir < 0 ? WORLD_R - f.x : f.x - WORLD_L;
  const cornered = room < 130;
  brain.t += dt;

  // Reactions: jump on a whiffed kick, back off from a loaded one
  // (or, with nowhere to back off to, load up and fight)
  const lowThreat = dist < 270 && o.a1 < 0.6 && (o.swing || o.a2 > 1.3);
  const staleCheck = kneeUp(o) && !isChecking(o);
  if (!busy && o.over > 0 && dist < 330 && Math.random() < dt * (4 + 8 * skill)) aiSet("punish");
  else if (!busy && staleCheck && dist < 300 && Math.random() < dt * (2 + 6 * skill)) aiSet("punish");
  // Tilted back, they're exposed: get in there before the power kick comes
  else if (!busy && o.a1 < BACK_A1 && dist < 290 && f.over <= 0 && Math.random() < dt * (1 + 5 * skill)) aiSet("punish");
  else if (!busy && brain.state !== "check" && f.over <= 0 && lowThreat
    && Math.random() < dt * (1 + 5 * skill) * (room < 320 ? 2 : 1)) aiSet("check");
  else if (!busy && brain.state !== "retreat" && threat && Math.random() < dt * (2 + 6 * skill))
    aiSet(room < 320 ? "punish" : "retreat");

  switch (brain.state) {
    case "approach": {
      // Hover just outside their reach, then step in to attack
      const want = 265;
      if (dist > want + 15) i.fwd = true;
      else if (dist < want - 25 && room > 320) i.back = true;   // don't give up the last of the floor
      i.bend = f.a2 < 0.4;
      if (cornered && dist < 300) aiSet(lowThreat ? "check" : "punish");
      else if (dist < want + 50 && brain.t > brain.wait) aiSet("chamber");
      break;
    }
    case "chamber": {
      if (brain.power) {
        // Tilt all the way back and cock the foot, then wait for range
        i.down = true;
        i.bend = true;
        if (dist > brain.range + 20) i.fwd = true;
        else if (dist < brain.range - 40) i.back = true;
        if (f.windup && Math.abs(dist - brain.range) < 30) aiSet("kick");
        else if (brain.t > 1.4) aiSet("approach");
        break;
      }
      i.up = f.a1 < brain.kneeTarget;
      i.down = f.a1 > brain.kneeTarget + 0.25;
      i.bend = true;
      if (dist > brain.range + 30) i.fwd = true;
      else if (dist < brain.range - 40) i.back = true;
      const off = dist - brain.range;
      const ready = f.a2 > 1.6 && Math.abs(f.a1 - brain.kneeTarget) < 0.25 && off > -45 && off < 10 + 35 * (1 - skill);
      if (ready && brain.feint) aiSet("feint");
      else if (ready && isChecking(o) && brain.wary) { /* hold it and wait out their check */ }
      else if (ready) aiSet("kick");
      else if (brain.t > 0.9) aiSet(Math.random() < skill ? "approach" : "kick");
      break;
    }
    case "feint": {
      // Show the loaded leg, then drop it and see if they bite
      if (brain.t < 0.12) i.fwd = true;
      else if (brain.t < 0.3) i.back = true;
      i.down = f.a1 > 0.3;
      if (brain.t > brain.wait) {
        aiSet(Math.random() < 0.5 ? "chamber" : "approach");
        brain.wait *= 0.3;
      }
      break;
    }
    case "check": {
      // Snap the knee up with the shin hanging, then drop it once it goes stale
      i.up = f.a1 < 1.1;
      i.down = f.a1 > 1.35;
      i.bend = f.a2 < 1.0;
      if (brain.t > CHECK_WINDOW + 0.1) aiSet(threat && room > 320 ? "retreat" : "approach");
      break;
    }
    case "punish": {
      i.bend = true;
      i.down = f.a1 > 0.4;
      if (dist > 225) i.fwd = true;
      // Caught still loading by a low kick: raising the knee is quicker
      if (f.a2 < 1.0 && lowThreat && o.swing && o.over <= 0 && Math.random() < skill) { aiSet("check"); break; }
      // A leg tilted back is farther away; step in closer for it
      const reach = o.a1 < BACK_A1 ? 205 : 245;
      if (dist > reach - 20) i.fwd = true;
      if (f.a2 > 1.3 && dist < reach) { brain.range = dist; aiSet("kick"); }
      else if (brain.t > 0.5) aiSet("approach");
      break;
    }
    case "kick": {
      i.ext = true;
      i.up = brain.power || (!brain.flick && f.a1 < brain.kneeTarget);
      if (dist > brain.range) i.fwd = true;
      if (f.a2 < 0.08 || f.hitCd > 0 || brain.t > 0.35) aiSet("recover");
      break;
    }
    case "recover": {
      if (cornered && dist < 300 && f.over <= 0) { aiSet(lowThreat ? "check" : "punish"); break; }
      if (brain.t < 0.25) i.back = room > 320 && Math.random() < 0.8;
      i.down = f.a1 > 0.4;
      if (brain.t > 0.3 + Math.random() * 0.3) aiSet(Math.random() < 0.25 ? "chamber" : "approach");
      break;
    }
    case "retreat": {
      // Back off with the foot down so you're quick; load up once clear
      i.back = true;
      i.bend = dist > 300;
      i.down = f.a1 > 0.3;
      // They're walking in loaded: kick into their windup
      if (f.a2 > 1.4 && dist < 235 && o.a2 > 1.1 && Math.random() < dt * 10 * skill) {
        brain.flick = true; brain.power = false; brain.range = dist; aiSet("kick");
        break;
      }
      if (cornered) { aiSet(lowThreat ? "check" : "punish"); break; }
      if (threat && dist < 290 && brain.t < 0.8) break;
      if (brain.t > 0.3 + Math.random() * 0.2) aiSet(Math.random() < 0.55 ? "chamber" : "approach");
      break;
    }
  }
}

function confirmSelect() {
  playerLook = ROSTER[selIndex];

  game.ladder = ROSTER.filter((_, i) => i !== selIndex);
  for (let i = game.ladder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [game.ladder[i], game.ladder[j]] = [game.ladder[j], game.ladder[i]];
  }
  game.stage = 0;

function newMatch() {
  cpuLook = game.ladder[game.stage];
  game.wins = [0, 0];
  newRound();
}

const WINS_NEEDED = 2;
const matchDecided = () => game.wins[0] >= WINS_NEEDED || game.wins[1] >= WINS_NEEDED;

// Called from the post-round screens
function advance() {
  if (game.state === "over") {
    if (!matchDecided()) newRound();
    else if (game.wins[0] < WINS_NEEDED) newMatch();             // retry the same opponent
    else if (game.stage + 1 < game.ladder.length) { game.stage++; newMatch(); }
    else { game.state = "champion"; game.t = 0; }
  } else if (game.state === "champion") game.state = "select";
}

function selectKey(key) {
  const c = selIndex % 3, r = Math.floor(selIndex / 3);
  if (key === "arrowleft") selIndex = r * 3 + (c + 2) % 3;
  else if (key === "arrowright") selIndex = r * 3 + (c + 1) % 3;
  else if (key === "arrowup") selIndex = ((r + 2) % 3) * 3 + c;
  else if (key === "arrowdown") selIndex = ((r + 1) % 3) * 3 + c;
  else if (key === "enter" || key === " ") confirmSelect();
}

// ---------- Game ----------
const game = { state: "title", t: 0, wins: [0, 0], winner: null, ladder: [], stage: 0 };
let player, cpu, playerLook, cpuLook;
let camX = 0;

function newRound() {
  player = makeFighter(310, 1, playerLook);
  cpu = makeFighter(650, -1, cpuLook);
  particles = []; popups = [];
  camX = 0;
  ticker.hist = []; ticker.drift = 0;
  aiSet("approach");
  game.state = "intro";
  game.t = 0;
  game.winner = null;
}

function update(dt) {
  game.t += dt;
  clock += dt;
  if (game.state === "title") { updateTitle(dt); return; }
  if (game.state === "select" || game.state === "champion") return;
  // Mid-match rounds roll on by themselves
  if (game.state === "over" && !matchDecided() && game.t > 2.8) advance();

  if (game.state === "fight") {
    readPlayer(player);
    aiThink(cpu, player, dt);
  } else {
    player.input = {};
    cpu.input = {};
    if (game.state === "intro" && game.t > 1.6) { game.state = "fight"; game.t = 0; }
  }

  for (const f of [player, cpu]) {
    f.prevSamples = footSamples(f.pose);
    f.prevX = f.x;
    stepFighter(f, dt);
  }

  // Keep hips apart and on screen
  const gap = cpu.x - player.x;
  if (gap < MIN_SEP) {
    const push = (MIN_SEP - gap) / 2;
    player.x -= push; cpu.x += push;
    if (player.vx > 0) player.vx = 0;
    if (cpu.vx < 0) cpu.vx = 0;
  }
  // Both fighters must fit on screen; whoever is backing away gets stopped
  if (gap > MAX_SEP) {
    const pOut = Math.max(0, -player.vx), cOut = Math.max(0, cpu.vx);
    const share = pOut + cOut > 0 ? pOut / (pOut + cOut) : 0.5;
    const excess = gap - MAX_SEP;
    player.x += excess * share; cpu.x -= excess * (1 - share);
    if (player.vx < 0) player.vx = 0;
    if (cpu.vx > 0) cpu.vx = 0;
  }
  for (const f of [player, cpu]) {
    if (f.x < WORLD_L + 70) { f.x = WORLD_L + 70; f.vx = Math.max(0, f.vx); }
    if (f.x > WORLD_R - 70) { f.x = WORLD_R - 70; f.vx = Math.min(0, f.vx); }
    f.pose = pose(f);
  }
  const camTarget = Math.max(WORLD_L, Math.min(WORLD_R - W, (player.x + cpu.x) / 2 - W / 2));
  camX += (camTarget - camX) * Math.min(1, dt * 10);

  if (game.state === "fight") {
    // Alternate who's checked first so neither side wins every same-frame trade
    const [a, b] = Math.random() < 0.5 ? [player, cpu] : [cpu, player];
    checkHit(a, b, dt);
    checkHit(b, a, dt);
    trackSwing(player, dt);
    trackSwing(cpu, dt);
    if (player.hp <= 0 || cpu.hp <= 0) {
      game.state = "over";
      game.t = 0;
      game.winner = player.hp <= 0 ? cpu : player;
      game.wins[game.winner === player ? 0 : 1]++;
      hitStop = 0.35;
    }
  }

  for (const f of [player, cpu]) f.shownHp += (f.hp - f.shownHp) * Math.min(1, dt * 3);
  tickTicker(dt);

  for (const p of particles) {
    p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  for (const p of popups) { p.y -= 50 * dt; p.life -= dt; }
  popups = popups.filter(p => p.life > 0);
  shake *= Math.exp(-12 * dt);
}

// Stock ticker for the boardroom: tracks the opponent's health with some noise
const ticker = { hist: [], acc: 0, drift: 0 };
function tickTicker(dt) {
  ticker.acc += dt;
  while (ticker.acc > 0.1) {
    ticker.acc -= 0.1;
    ticker.drift = ticker.drift * 0.96 + (Math.random() - 0.5) * 1.6;
    ticker.hist.push(cpu.hp + ticker.drift);
    if (ticker.hist.length > 90) ticker.hist.shift();
  }
}

function mulberry32(a) {
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function par(p, fn) {
  ctx.save();
  ctx.translate(-Math.round(camX * p), 0);
  fn();
  ctx.restore();
}

function vgrad(y0, y1, stops) {
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  for (const [o, c] of stops) g.addColorStop(o, c);
  return g;
}

// Soft circular light; rgb is "r,g,b"
function glow(x, y, r, rgb, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}

function flicker(seed) {
  return 0.8 + 0.12 * Math.sin(clock * 13 + seed) + 0.08 * Math.sin(clock * 29 + seed * 3);
}

function flame(x, y, s, seed) {
  const f = flicker(seed);
  const h = s * 2.4 * f;
  ctx.fillStyle = "#ff8a1e";
  ctx.beginPath();
  ctx.moveTo(x - s, y);
  ctx.quadraticCurveTo(x - s, y - h * 0.5, x + Math.sin(clock * 9 + seed) * s * 0.4, y - h);
  ctx.quadraticCurveTo(x + s, y - h * 0.5, x + s, y);
  ctx.fill();
  ctx.fillStyle = "#ffe08a";
  ctx.beginPath();
  ctx.ellipse(x, y - s * 0.5, s * 0.45, s * 0.8 * f, 0, 0, Math.PI * 2);
  ctx.fill();
}

// Floor slab across the whole arena, with a lit top edge
function floor(color, edge) {
  ctx.fillStyle = color;
  ctx.fillRect(WORLD_L - 200, GROUND, WORLD_R - WORLD_L + 400, H - GROUND);
  ctx.fillStyle = edge;
  ctx.fillRect(WORLD_L - 200, GROUND, WORLD_R - WORLD_L + 400, 2);
}

// A strip of skyline: buildings standing on baseY, with lit windows
function skyline(bs, baseY, color, win) {
  for (const b of bs) {
    ctx.fillStyle = color;
    ctx.fillRect(b.x, baseY - b.h, b.w, b.h);
    for (const w of b.wins) {
      ctx.fillStyle = win;
      ctx.globalAlpha = w.a * (w.blink ? 0.6 + 0.4 * Math.sin(clock * 2 + w.x) : 1);
      ctx.fillRect(b.x + w.x, baseY - b.h + w.y, w.s, w.s * 1.4);
    }
    ctx.globalAlpha = 1;
  }
}
function makeSkyline(R, x0, x1, wMin, wMax, hMin, hMax, winSize, litChance) {
  const bs = [];
  for (let x = x0; x < x1;) {
    const w = wMin + R() * (wMax - wMin), h = hMin + R() * (hMax - hMin);
    const wins = [];
    for (let wy = 8; wy < h - 10; wy += winSize * 2.6)
      for (let wx = 5; wx < w - winSize - 4; wx += winSize * 2)
        if (R() < litChance) wins.push({ x: wx, y: wy, s: winSize, a: 0.3 + R() * 0.5, blink: R() < 0.05 });
    bs.push({ x, w, h, wins });
    x += w + R() * 6;
  }
  return bs;
}

          ctx.beginPath();
          ctx.moveTo(x + 22, GROUND); ctx.lineTo(x + 22, 290); ctx.arc(x + 75, 290, 53, Math.PI, 0); ctx.lineTo(x + 128, GROUND);
          ctx.fill();
        }
        // A bell hanging in one arch
        ctx.strokeStyle = "#111"; ctx.lineWidth = 2;
        const bx = 435, sw = Math.sin(clock * 0.8) * 0.06;
        ctx.save(); ctx.translate(bx, 240); ctx.rotate(sw);
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 20); ctx.stroke();
        ctx.fillStyle = "#6a5a32";
        ctx.beginPath(); ctx.moveTo(-16, 54); ctx.quadraticCurveTo(-14, 20, 0, 20); ctx.quadraticCurveTo(14, 20, 16, 54); ctx.fill();
        ctx.restore();
      });
      par(1, () => {
        ctx.fillStyle = "#0c170e";
        for (let x = WORLD_L - 100; x < WORLD_R + 100; x += 90) { ctx.beginPath(); ctx.ellipse(x, 456, 52, 26, 0, Math.PI, 0); ctx.fill(); }
        ctx.fillRect(WORLD_L - 200, 450, WORLD_R - WORLD_L + 400, 22);
        floor("#2a2a25", "#3c3c35");
        ctx.fillStyle = "#0f1a10"; ctx.fillRect(WORLD_L - 200, GROUND + 26, WORLD_R - WORLD_L + 400, H - GROUND - 26);
        for (const f of c.flies) {
          const x = f.x + Math.sin(clock * f.s + f.p) * 30, y = f.y + Math.sin(clock * f.s * 1.3 + f.p * 2) * 15;
          const a = Math.max(0, Math.sin(clock * 2 * f.s + f.p));
          glow(x, y, 10, "210,255,120", 0.5 * a);
          ctx.fillStyle = `rgba(230,255,160,${a})`; ctx.fillRect(x - 1, y - 1, 2, 2);
        }
      });
    },
  },
};

const stageCache = {};
function currentStage() {
  const id = cpu.look.stage;
  if (!stageCache[id]) {
    let seed = 0;
    for (const ch of id) seed = seed * 31 + ch.charCodeAt(0);
    stageCache[id] = STAGES[id].init(mulberry32(seed));
  }
  return { stage: STAGES[id], data: stageCache[id] };
}

// ---------- Rendering ----------
function limb(a, b, w, color, cap = "round") {
  ctx.strokeStyle = color;
  ctx.lineWidth = w;
  ctx.lineCap = cap;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
}

function lerpPt(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }

function drawFighter(f) {
  const p = f.pose, L = f.look;
  const flash = f.flash > 0;
  const skin = flash ? "#fff" : L.skin;
  const dark = flash ? "#ddd" : L.skinDark;

  // Thigh + shin (dark outline pass, then skin)
  limb(p.H, p.K, 42, dark);
  // Shin stops short of the ankle so its rounded end stays inside the shoe
  const shinEnd = lerpPt(p.A, p.K, 0.12);
  // A live knee check lights up the shin
  limb(p.K, shinEnd, 34, isChecking(f) ? "#d8ffc4" : dark);
  limb(p.H, p.K, 36, skin);
  limb(p.K, shinEnd, 28, skin);

  // Kneecap
  ctx.fillStyle = dark;
  const kx = p.K.x + f.dir * 8 * Math.cos(f.a1 - f.a2 / 2);
  const ky = p.K.y - 8 * Math.sin(f.a1 - f.a2 / 2);
  ctx.beginPath(); ctx.arc(kx, ky, 6, 0, Math.PI * 2); ctx.fill();

  // Sock: flat-ended tube from inside the shoe up the shin, with a stripe near the top
  limb(p.A, lerpPt(p.A, p.K, 0.3), 30, flash ? "#fff" : "#f2f2f2", "butt");
  limb(lerpPt(p.A, p.K, 0.2), lerpPt(p.A, p.K, 0.25), 30, L.shoe, "butt");

  // An armed power kick makes the shoe glow
  if (f.windup && !f.swing) {
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.25 * Math.sin(clock * 18);
    ctx.shadowColor = "#ff9a2e"; ctx.shadowBlur = 18;
    limb(p.Hl, p.T, 34, "#ff9a2e");
    ctx.restore();
  }
  // Shoe
  limb(p.Hl, p.T, 24, L.shoe);
  // Sole on the side away from the shin
  const nx = Math.sin(p.fa + Math.PI / 2) * f.dir, ny = Math.cos(p.fa + Math.PI / 2);
  const off = 9;
  limb({ x: p.Hl.x - nx * off, y: p.Hl.y - ny * off }, { x: p.T.x - nx * off, y: p.T.y - ny * off }, 6, L.trim);
  // Laces
  ctx.fillStyle = L.trim;
  for (let t = 0.45; t < 0.9; t += 0.15) {
    const q = lerpPt(p.Hl, p.T, t);
    ctx.beginPath(); ctx.arc(q.x + nx * 6, q.y + ny * 6, 2, 0, Math.PI * 2); ctx.fill();
  }

  // Shorts cuff at the hip
  ctx.save();
  ctx.translate(p.H.x, p.H.y);
  ctx.rotate(-f.dir * f.a1);
  ctx.fillStyle = L.shoe;
  ctx.beginPath();
  ctx.roundRect(-30, -60, 60, 82, 8);
  ctx.fill();
  if (L.piping) {
    // One stripe of side-by-side colors straight down the middle
    const w = 4, x0 = -w * L.piping.length / 2;
    L.piping.forEach((c, k) => {
      ctx.fillStyle = c;
      ctx.fillRect(x0 + k * w, -60, w, 82);
    });
  } else {
    ctx.fillStyle = L.trim;
    ctx.fillRect(-30, 16, 60, 5);
  }
  ctx.restore();
}

function drawHealth(f, x, alignRight) {
  const w = 380, h = 22, y = 30;
  ctx.fillStyle = "#222";
  ctx.fillRect(x, y, w, h);
  const shown = w * f.shownHp / 100, real = w * f.hp / 100;
  ctx.fillStyle = "#c22";
  if (alignRight) ctx.fillRect(x + w - shown, y, shown, h); else ctx.fillRect(x, y, shown, h);
  ctx.fillStyle = f.hp > 30 ? "#ffd400" : "#ff7b00";
  if (alignRight) ctx.fillRect(x + w - real, y, real, h); else ctx.fillRect(x, y, real, h);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);

  ctx.fillStyle = f.look.shoe;
  ctx.font = "bold 16px monospace";
  ctx.textAlign = alignRight ? "right" : "left";
  ctx.fillText(f.look.name, alignRight ? x + w : x, y + h + 22);
}

function bigText(text, size, color, y) {
  ctx.font = `900 ${size}px Impact, "Arial Black", sans-serif`;
  ctx.textAlign = "center";
  ctx.lineWidth = 8;
  ctx.strokeStyle = "#000";
  ctx.strokeText(text, W / 2, y);
  ctx.fillStyle = color;
  ctx.fillText(text, W / 2, y);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (game.state === "title") { renderTitle(); return; }
  if (game.state === "select") { renderSelect(); return; }

  ctx.save();
  if (shake > 0.3) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  const { stage, data } = currentStage();
  stage.draw(data);
  // Darken the top so the HUD stays readable
  ctx.fillStyle = vgrad(0, 100, [[0, "rgba(0,0,0,0.6)"], [1, "rgba(0,0,0,0)"]]);
  ctx.fillRect(-20, -20, W + 40, 120);
  ctx.translate(-Math.round(camX), 0);

  // Shadows
  for (const f of [player, cpu]) {
    ctx.fillStyle = "rgba(0,0,0,0.4)";
    ctx.beginPath();
    ctx.ellipse(f.pose.A.x + f.dir * 15, GROUND + 4, 45, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  drawFighter(cpu);
  drawFighter(player);

  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.font = `900 ${p.big ? 30 : p.color ? 18 : 22}px Impact, "Arial Black", sans-serif`;
    ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "#000";
    ctx.strokeText(p.text, p.x, p.y);
    ctx.fillStyle = p.color || (p.big ? "#ff5a3c" : "#fff");
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  drawHealth(player, 40, false);
  drawHealth(cpu, W - 420, true);
  drawRoundPips(game.wins[0], 40 + 380 - 16, -1);
  drawRoundPips(game.wins[1], W - 420 + 16, 1);
  ctx.font = "bold 14px monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = "#888";
  ctx.fillText(`STAGE ${game.stage + 1}/${game.ladder.length}`, W / 2, 46);

  ctx.font = "13px monospace";
  ctx.fillStyle = "rgba(255,255,255,0.45)";
  ctx.fillText("← →  move     ↑ ↓  raise / lower knee (up blocks low kicks)     A  draw foot back     D  kick out", W / 2, H - 26);
  ctx.fillText("power kick:  hold ↓ + A, then ↑ + D     (while tilted back you take extra damage)", W / 2, H - 9);

  const hint = text => {
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = "#aaa";
    ctx.textAlign = "center";
    ctx.fillText(text, W / 2, 372);
  };
  // The match winner gets the last word
  const winQuote = f => {
    ctx.font = "italic 18px Georgia, serif";
    ctx.textAlign = "center";
    ctx.fillStyle = f.look.shoe;
    ctx.fillText(`${f.look.name}: “${f.look.quote}”`, W / 2, 330);
  };
  const round = game.wins[0] + game.wins[1] + 1;

  if (game.state === "intro") {
    if (game.t < 1.0) {
      bigText(round === 3 ? "FINAL ROUND" : "ROUND " + round, 64, "#fff", 230);
      ctx.font = "bold 16px monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "#aaa";
      ctx.fillText(`${player.look.name}  vs  ${cpu.look.name}`, W / 2, 270);
      ctx.font = "italic 15px Georgia, serif";
      ctx.fillStyle = "#ccc";
      ctx.fillText(currentStage().stage.title, W / 2, 296);
    } else bigText("FIGHT!", 90, "#ffd400", 240);
  } else if (game.state === "over") {
    if (matchDecided()) {
      ctx.fillStyle = "rgba(0,0,0,0.6)";
      ctx.fillRect(0, 300, W, 90);
    }
    bigText("K.O.", 110, "#ff3b3b", 220);
    if (!matchDecided()) {
      bigText(game.winner === player ? "YOU TAKE THE ROUND" : "ROUND LOST", 44, "#fff", 285);
    } else if (game.wins[0] >= WINS_NEEDED) {
      bigText(cpu.look.name.toUpperCase() + " IS DEFEATED", 40, "#fff", 285);
      winQuote(player);
      if (game.t > 0.8) hint(game.stage + 1 < game.ladder.length
        ? "ENTER  next opponent      C  choose fighter"
        : "ENTER  continue");
    } else {
      bigText("YOU LOSE", 48, "#fff", 285);
      winQuote(cpu);
      if (game.t > 0.8) hint("ENTER  rematch      C  choose fighter");
    }
  } else if (game.state === "champion") {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);
    bigText("CHAMPION", 100, "#ffd400", 220);
    bigText(player.look.name.toUpperCase(), 40, player.look.shoe, 280);
    ctx.font = "italic 16px Georgia, serif";
    ctx.fillStyle = "#bbb";
    ctx.textAlign = "center";
    ctx.fillText("Every foot has fallen. It changes nothing.", W / 2, 318);
    if (game.t > 0.8) {
      ctx.font = "bold 16px monospace";
      ctx.fillStyle = "#aaa";
      ctx.fillText("ENTER  choose fighter", W / 2, 370);
    }
  }
}

// Round-win markers beside the health bar, filling inward toward the center
function drawRoundPips(won, x, step) {
  for (let i = 0; i < WINS_NEEDED; i++) {
    const cx = x + step * i * 22;
    ctx.beginPath(); ctx.arc(cx, 72, 7, 0, Math.PI * 2);
    ctx.fillStyle = i < won ? "#ffd400" : "#222";
    ctx.fill();
    ctx.strokeStyle = "#888"; ctx.lineWidth = 1.5; ctx.stroke();
  }
}

// Breaks text into lines no wider than maxW using the current font
function wrapText(text, maxW) {
  const lines = [];
  let line = "";
  for (const word of text.split(" ")) {
    const test = line ? line + " " + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Draws a roster leg with its foot on y = baseY, hip at x = hipX
function drawPortrait(i, hipX, baseY, scale, a1, a2) {
  const f = portraits[i];
  f.a1 = a1; f.a2 = a2; f.a3 = 0;
  f.pose = pose(f);
  ctx.save();
  ctx.translate(hipX, baseY);
  ctx.scale(scale, scale);
  ctx.translate(0, -GROUND);
  drawFighter(f);
  ctx.restore();
}

function renderSelect() {
  const t = game.t;
  bigText("CHOOSE YOUR FIGHTER", 46, "#fff", 72);

  for (let i = 0; i < ROSTER.length; i++) {
    const c = cellRect(i), r = ROSTER[i], on = i === selIndex;
    ctx.fillStyle = on ? "#1c1c1c" : "#0d0d0d";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.strokeStyle = on ? r.shoe : "#333";
    ctx.lineWidth = on ? 3 : 1;
    ctx.strokeRect(c.x + 0.5, c.y + 0.5, c.w - 1, c.h - 1);

    const bob = on ? Math.sin(t * 6) : 0;
    drawPortrait(i, c.x + c.w / 2 - 12, c.y + 80, 0.24, 0.25 + 0.2 * bob, 0.5 + 0.3 * bob);

    ctx.font = "bold 12px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = on ? "#fff" : "#999";
    const lines = wrapText(r.name.toUpperCase(), c.w - 14);
    lines.forEach((ln, k) => ctx.fillText(ln, c.x + c.w / 2, c.y + 98 + k * 14 - (lines.length - 1) * 5));
  }

  // Large preview of the highlighted fighter
  const r = ROSTER[selIndex];
  const px = 640, pw = 290;
  drawPortrait(selIndex, px + 110, 392, 0.82,
    0.35 + 0.25 * Math.sin(t * 1.8), 0.7 + 0.45 * Math.sin(t * 1.8 + 1));

  let size = 34;
  do { ctx.font = `900 ${size}px Impact, "Arial Black", sans-serif`; size -= 2; }
  while (ctx.measureText(r.name.toUpperCase()).width > pw && size > 14);
  ctx.textAlign = "center";
  ctx.lineWidth = 6; ctx.strokeStyle = "#000";
  ctx.strokeText(r.name.toUpperCase(), px + pw / 2, 436);
  ctx.fillStyle = r.shoe;
  ctx.fillText(r.name.toUpperCase(), px + pw / 2, 436);

  ctx.font = "italic 15px Georgia, serif";
  ctx.fillStyle = "#bbb";
  wrapText(`“${r.quote}”`, pw).forEach((ln, k) => ctx.fillText(ln, px + pw / 2, 464 + k * 20));

  ctx.font = "13px monospace";
  ctx.fillStyle = "#555";
  ctx.fillText("← → ↑ ↓  choose     ENTER  fight", W / 2, H - 14);
}

// ---------- Title ----------
// FIGHTER drops in, then FEET lands on top of it, the computer announces the
// name, and the prompt fades in. Times are seconds since the title started.
const TITLE_G = 3400;           // fall acceleration, px/s²
const TITLE_DROP_FROM = -40;    // baseline start, just above the screen
const FIGHTER_Y = 372, FEET_Y = 226;
const FIGHTER_DROP = 0.3, FEET_DROP = 1.35, VOICE_T = 2.0, PROMPT_T = 3.3;
const landTime = (drop, target) => drop + Math.sqrt(2 * (target - TITLE_DROP_FROM) / TITLE_G);

// Before the logo, an arcade-style INSERT COIN screen collects the key press
// the browser needs before it will play sound
const title = { t: 0, fired: {}, shake: 0, dust: [], waiting: true, coinT: null };

function startTitle() {
  title.waiting = false;
  title.t = 0;
  title.fired = {};
}

function titleKey() {
  if (title.waiting) {
    if (title.coinT === null) { title.coinT = clock; playCoin(); }
    return;
  }
  if (title.t < PROMPT_T) {
    // Skip straight to the finished logo
    title.t = PROMPT_T + 0.6;
    for (const k of ["fighter", "feet", "voice"]) title.fired[k] = true;
    return;
  }
  game.state = "select";
  game.t = 0;
  playHit(4, false);
}

function landDust(y, halfW) {
  for (let i = 0; i < 26; i++) {
    const side = i % 2 ? 1 : -1;
    title.dust.push({
      x: W / 2 + side * (halfW * (0.2 + Math.random() * 0.85)), y: y + 4,
      vx: side * (60 + Math.random() * 220), vy: -20 - Math.random() * 90,
      r: 6 + Math.random() * 10, life: 0.5 + Math.random() * 0.4, max: 0.9,
    });
  }
}

function updateTitle(dt) {
  if (title.waiting) {
    // Start once the browser has actually switched sound on
    if (title.coinT !== null && clock - title.coinT > 0.7) {
      if (audio && audio.state === "running") startTitle();
      else if (clock - title.coinT > 2) { audioUnlocked = false; startTitle(); }
    }
    return;
  }
  title.t += dt;
  const ev = (name, at, fn) => { if (title.t >= at && !title.fired[name]) { title.fired[name] = true; fn(); } };
  ev("fighter", landTime(FIGHTER_DROP, FIGHTER_Y), () => { playThud(1); title.shake = 12; landDust(FIGHTER_Y, 320); });
  ev("feet", landTime(FEET_DROP, FEET_Y), () => { playThud(0.8); title.shake = 9; landDust(FEET_Y, 230); });
  ev("voice", VOICE_T, () => speakFeetFighter());
  ev("prompt", PROMPT_T, () => playChime());
  for (const d of title.dust) { d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= Math.exp(-3 * dt); d.vy += 60 * dt; d.r += 14 * dt; d.life -= dt; }
  title.dust = title.dust.filter(d => d.life > 0);
  title.shake *= Math.exp(-10 * dt);
}

// Where a falling word is now: its baseline, and squash/stretch after impact
function dropState(drop, target) {
  const tau = title.t - drop;
  if (tau < 0) return null;
  const y = TITLE_DROP_FROM + 0.5 * TITLE_G * tau * tau;
  if (y < target) return { y, sx: 0.94, sy: 1.08 };   // stretched while falling
  const s = tau - Math.sqrt(2 * (target - TITLE_DROP_FROM) / TITLE_G);
  const bounce = 30 * Math.exp(-7 * s) * Math.abs(Math.sin(12 * s));
  const squash = Math.exp(-15 * s);
  return { y: target - bounce, sx: 1 + 0.16 * squash, sy: 1 - 0.3 * squash };
}

function blockWord(text, size, st, top, bottom) {
  ctx.save();
  ctx.translate(W / 2, st.y);
  ctx.scale(st.sx, st.sy);
  ctx.font = `${size}px Impact, "Arial Black", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "alphabetic";
  ctx.lineJoin = "round";
  // Extruded block depth
  ctx.lineWidth = 12;
  ctx.strokeStyle = "#000";
  for (let d = 14; d >= 1; d--) {
    ctx.fillStyle = d > 10 ? "#2a0600" : d > 5 ? "#5c1200" : "#8a2200";
    if (d === 14) ctx.strokeText(text, d * 0.7, d);
    ctx.fillText(text, d * 0.7, d);
  }
  ctx.strokeText(text, 0, 0);
  const g = ctx.createLinearGradient(0, -size * 0.75, 0, 0);
  g.addColorStop(0, "#ffffff");
  g.addColorStop(0.12, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillText(text, 0, 0);
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(255,255,255,0.6)";
  ctx.strokeText(text, 0, -2);
  ctx.restore();
}

function renderTitle() {
  if (title.waiting) {
    const paid = title.coinT !== null;
    ctx.textAlign = "center";
    ctx.font = "900 44px Impact, \"Arial Black\", sans-serif";
    if (paid || Math.floor(clock * 2) % 2 === 0) {
      ctx.lineWidth = 6; ctx.strokeStyle = "#000";
      ctx.strokeText("INSERT COIN", W / 2, H / 2 + 14);
      ctx.fillStyle = paid ? "#fff" : "#ffd400";
      ctx.fillText("INSERT COIN", W / 2, H / 2 + 14);
    }
    ctx.font = "bold 16px monospace";
    ctx.fillStyle = "#888";
    ctx.textAlign = "right";
    ctx.fillText(`CREDIT ${paid ? 1 : 0}`, W - 24, H - 20);
    return;
  }
  ctx.save();
  if (title.shake > 0.3) ctx.translate((Math.random() - 0.5) * title.shake, (Math.random() - 0.5) * title.shake);

  // Light rays behind the logo once it has landed
  const rays = Math.min(1, Math.max(0, (title.t - landTime(FEET_DROP, FEET_Y)) * 1.5));
  if (rays > 0) {
    ctx.save();
    ctx.translate(W / 2, 250);
    ctx.rotate(clock * 0.15);
    ctx.fillStyle = `rgba(255,170,40,${0.07 * rays})`;
    for (let k = 0; k < 16; k++) {
      ctx.rotate(Math.PI / 8);
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(900, -90); ctx.lineTo(900, 90); ctx.fill();
    }
    ctx.restore();
    glow(W / 2, 250, 380, "255,120,30", 0.2 * rays);
  }

  for (const d of title.dust) {
    ctx.fillStyle = `rgba(190,170,150,${0.35 * d.life / d.max})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }

  // FEET is drawn first so FIGHTER overlaps it
  const feet = dropState(FEET_DROP, FEET_Y);
  if (feet) blockWord("FEET", 196, feet, "#fff15a", "#ffa400");
  const fighter = dropState(FIGHTER_DROP, FIGHTER_Y);
  if (fighter) blockWord("FIGHTER", 176, fighter, "#ff8a3d", "#e8160c");
  ctx.restore();

  const fade = Math.min(1, Math.max(0, (title.t - PROMPT_T) / 0.6));
  if (fade > 0) {
    ctx.font = "bold 18px monospace";
    ctx.textAlign = "center";
    ctx.fillStyle = `rgba(200,200,200,${fade * (0.55 + 0.15 * Math.sin(clock * 3))})`;
    ctx.fillText("press any key to begin", W / 2, 462);
  }
}

// ---------- Title sounds ----------
function noiseBuffer(seconds) {
  const len = Math.floor(audio.sampleRate * seconds);
  const buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

// A heavy slam: falling sine for weight, filtered noise for the crunch
function playThud(power) {
  if (!soundOn()) return;
  const t = audio.currentTime;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = "sine";
  osc.frequency.setValueAtTime(140, t);
  osc.frequency.exponentialRampToValueAtTime(34, t + 0.3);
  g.gain.setValueAtTime(0.7 * power, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  osc.connect(g).connect(audio.destination);
  osc.start(t); osc.stop(t + 0.5);

  const src = audio.createBufferSource(), lp = audio.createBiquadFilter(), ng = audio.createGain();
  src.buffer = noiseBuffer(0.3);
  lp.type = "lowpass"; lp.frequency.setValueAtTime(1400, t); lp.frequency.exponentialRampToValueAtTime(200, t + 0.25);
  ng.gain.setValueAtTime(0.55 * power, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  src.connect(lp).connect(ng).connect(audio.destination);
  src.start(t);
}

// Two-tone coin drop
function playCoin() {
  if (!soundOn()) return;
  const t = audio.currentTime + 0.03;
  [[988, 0, 0.08], [1319, 0.08, 0.45]].forEach(([f, at, len]) => {
    const osc = audio.createOscillator(), g = audio.createGain();
    osc.type = "square";
    osc.frequency.value = f;
    g.gain.setValueAtTime(0.1, t + at);
    g.gain.exponentialRampToValueAtTime(0.001, t + at + len);
    osc.connect(g).connect(audio.destination);
    osc.start(t + at); osc.stop(t + at + len + 0.02);
  });
}

// Rising arpeggio for the prompt
function playChime() {
  if (!soundOn()) return;
  const t = audio.currentTime;
  [523.25, 659.25, 783.99, 1046.5, 1318.5, 2093].forEach((f, i) => {
    const at = t + i * 0.06;
    for (const [type, mult, vol] of [["square", 1, 0.05], ["triangle", 2, 0.06]]) {
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = type;
      osc.frequency.value = f * mult;
      g.gain.setValueAtTime(0, at);
      g.gain.linearRampToValueAtTime(vol, at + 0.005);
      g.gain.exponentialRampToValueAtTime(0.001, at + 0.5);
      osc.connect(g).connect(audio.destination);
      osc.start(at); osc.stop(at + 0.55);
    }
  });
}

// A crude formant synthesizer, in the spirit of early-80s speech chips: a
// buzzing sawtooth shaped by three resonant filters for the vowels, hiss for
// the consonants, all crushed down to a few bits.
function speakFeetFighter() {
  if (!soundOn()) return;
  const t0 = audio.currentTime + 0.02;

  const crush = audio.createWaveShaper();
  const curve = new Float32Array(1024);
  for (let i = 0; i < 1024; i++) curve[i] = Math.round((i / 511.5 - 1) * 5) / 5;
  crush.curve = curve;
  const master = audio.createGain();
  master.gain.value = 0.32;
  const mix = audio.createGain();
  mix.gain.value = 1;
  mix.connect(crush).connect(master).connect(audio.destination);

  const buzz = audio.createOscillator();
  buzz.type = "sawtooth";
  const voiced = audio.createGain();
  voiced.gain.value = 0;
  buzz.connect(voiced);
  const formants = [[9, 3.2], [12, 2.2], [14, 1.2]].map(([q, vol]) => {
    const f = audio.createBiquadFilter(), g = audio.createGain();
    f.type = "bandpass"; f.Q.value = q; g.gain.value = vol;
    voiced.connect(f).connect(g).connect(mix);
    return f;
  });

  const hiss = audio.createBufferSource();
  hiss.buffer = noiseBuffer(2);
  const hp = audio.createBiquadFilter();
  hp.type = "highpass"; hp.frequency.value = 1600;
  const unvoiced = audio.createGain();
  unvoiced.gain.value = 0;
  hiss.connect(hp).connect(unvoiced).connect(mix);

  let t = t0;
  const formantsAt = (fs, at, glide) => formants.forEach((f, i) =>
    glide ? f.frequency.linearRampToValueAtTime(fs[i], at) : f.frequency.setValueAtTime(fs[i], at));
  const pitch = (from, to, a, b) => { buzz.frequency.setValueAtTime(from, a); buzz.frequency.linearRampToValueAtTime(to, b); };
  const level = (node, v, at) => node.gain.linearRampToValueAtTime(v, at);
  const fric = (dur, vol) => {
    unvoiced.gain.setValueAtTime(0, t); level(unvoiced, vol, t + 0.02);
    level(unvoiced, vol, t + dur - 0.02); level(unvoiced, 0, t + dur);
    t += dur;
  };
  const stop = (closure) => {
    voiced.gain.setValueAtTime(1, t); level(voiced, 0, t + 0.015);
    t += closure;
    unvoiced.gain.setValueAtTime(0, t); level(unvoiced, 0.5, t + 0.005); level(unvoiced, 0, t + 0.035);
    t += 0.04;
  };

  // F
  hp.frequency.setValueAtTime(1600, t);
  fric(0.09, 0.22);
  // EE, as in "feet"
  formantsAt([290, 2250, 3000], t, false);
  pitch(155, 135, t, t + 0.22);
  voiced.gain.setValueAtTime(0, t); level(voiced, 1, t + 0.025);
  t += 0.22;
  // T
  hp.frequency.setValueAtTime(3000, t);
  stop(0.05);
  t += 0.07;
  // F
  hp.frequency.setValueAtTime(1600, t);
  fric(0.08, 0.22);
  // AI: glide from "ah" to "ih"
  formantsAt([760, 1150, 2500], t, false);
  pitch(165, 140, t, t + 0.25);
  voiced.gain.setValueAtTime(0, t); level(voiced, 1, t + 0.025);
  formantsAt([780, 1250, 2500], t + 0.08, true);
  formantsAt([400, 1900, 2560], t + 0.25, true);
  t += 0.25;
  // Flapped T: just a quick dip in the buzz
  level(voiced, 0.15, t + 0.02);
  level(voiced, 1, t + 0.05);
  formantsAt([500, 1400, 1800], t + 0.05, true);
  t += 0.05;
  // ER, falling off at the end
  pitch(135, 88, t, t + 0.32);
  formantsAt([480, 1300, 1650], t + 0.08, true);
  level(voiced, 1, t + 0.22);
  level(voiced, 0, t + 0.32);
  t += 0.32;

  buzz.start(t0); hiss.start(t0);
  buzz.stop(t + 0.1); hiss.stop(t + 0.1);
}

// ---------- Loop ----------
// If the browser already allows sound, skip the coin screen
initAudio(false);
if (audio && audio.state === "running") startTitle();
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (hitStop > 0) {
    const used = Math.min(hitStop, dt);
    hitStop -= used;
    dt -= used;
    // Keep visual effects moving a little during hit-stop
    shake *= 0.98;
  }
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
